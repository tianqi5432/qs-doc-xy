<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proxy Node Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f1a;color:#e0e0e0;min-height:100vh}
.container{max-width:960px;margin:0 auto;padding:20px}
header{text-align:center;padding:30px 0 20px}
header h1{font-size:28px;background:linear-gradient(135deg,#00d2ff,#7b2ff7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:#888;margin-top:8px;font-size:14px}
.status-bar{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:20px 0}
.status-chip{display:flex;align-items:center;gap:6px;background:#1a1a2e;padding:8px 16px;border-radius:20px;font-size:13px;border:1px solid #2a2a4a}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.status-dot.green{background:#00e676;box-shadow:0 0 6px #00e676}
.status-dot.yellow{background:#ffd740;box-shadow:0 0 6px #ffd740}
.status-dot.red{background:#ff5252;box-shadow:0 0 6px #ff5252}
.info-box{background:linear-gradient(135deg,#1a1a2e,#16213e);border:1px solid #2a2a4a;border-radius:12px;padding:20px;margin:20px 0}
.info-box .label{color:#888;font-size:12px;text-transform:uppercase;letter-spacing:1px}
.info-box .value{color:#00d2ff;font-size:14px;word-break:break-all;margin-top:4px;font-family:'Courier New',monospace}
.protocol-grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:20px}
.proto-card{background:#1a1a2e;border:1px solid #2a2a4a;border-radius:12px;overflow:hidden;transition:border-color .2s}
.proto-card:hover{border-color:#7b2ff7}
.proto-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;cursor:pointer;user-select:none}
.proto-header h3{font-size:16px;display:flex;align-items:center;gap:10px}
.proto-badge{font-size:11px;padding:3px 10px;border-radius:10px;font-weight:600;text-transform:uppercase}
.badge-vless{background:rgba(0,210,255,.15);color:#00d2ff}
.badge-vmess{background:rgba(123,47,247,.15);color:#7b2ff7}
.badge-trojan{background:rgba(255,107,53,.15);color:#ff6b35}
.badge-hysteria{background:rgba(255,215,64,.15);color:#ffd740}
.proto-toggle{font-size:18px;color:#888;transition:transform .2s}
.proto-toggle.open{transform:rotate(180deg)}
.proto-body{padding:0 20px 20px;display:none}
.proto-body.show{display:block}
.config-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #2a2a4a;font-size:13px}
.config-row:last-child{border-bottom:none}
.config-row .k{color:#888}
.config-row .v{color:#e0e0e0;font-family:'Courier New',monospace;text-align:right;word-break:break-all;max-width:60%}
.btn-group{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{padding:8px 20px;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,#00d2ff,#7b2ff7);color:#fff}
.btn-primary:hover{opacity:.85;transform:translateY(-1px)}
.btn-secondary{background:#2a2a4a;color:#e0e0e0;border:1px solid #3a3a5a}
.btn-secondary:hover{background:#3a3a5a}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#00e676;color:#000;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}
.note{background:rgba(255,215,64,.1);border:1px solid rgba(255,215,64,.3);border-radius:8px;padding:12px 16px;margin-top:12px;font-size:12px;color:#ffd740;line-height:1.6}
.loading{text-align:center;padding:60px 0}
.loading .spinner{width:40px;height:40px;border:3px solid #2a2a4a;border-top-color:#00d2ff;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
footer{text-align:center;padding:30px 0;color:#555;font-size:12px}
@media(min-width:640px){.protocol-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Proxy Node Dashboard</h1>
    <p>Back4App Cloud Container - Multi-Protocol Proxy</p>
  </header>

  <div class="status-bar" id="statusBar">
    <div class="status-chip"><span class="status-dot green"></span> Xray Core</div>
    <div class="status-chip"><span class="status-dot yellow"></span> Hysteria2</div>
    <div class="status-chip"><span class="status-dot green"></span> Cloudflare Tunnel</div>
  </div>

  <div id="content">
    <div class="loading"><div class="spinner"></div><p>Loading node data...</p></div>
  </div>

  <footer>Powered by Xray + Hysteria2 + Cloudflare Tunnel | Hosted on Back4App</footer>
</div>

<div class="toast" id="toast">Copied!</div>

<script>
const $ = s => document.querySelector(s);
const toast = (msg) => { const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); };
const copy = (text) => { navigator.clipboard.writeText(text).then(()=>toast('Copied to clipboard!')).catch(()=>toast('Copy failed')); };

function renderDashboard(data) {
  const tunnelHost = data.tunnel_host;
  let html = '';

  // Tunnel info
  html += `<div class="info-box">
    <div class="label">Tunnel Domain</div>
    <div class="value">${tunnelHost || 'Loading...'}</div>
  </div>
  <div class="info-box">
    <div class="label">UUID / Password</div>
    <div class="value">${data.uuid} <a href="#" onclick="copy('${data.uuid}');return false" style="color:#7b2ff7;margin-left:8px;font-size:12px">[Copy]</a></div>
  </div>`;

  // Protocol cards
  html += '<div class="protocol-grid">';
  data.protocols.forEach((p, i) => {
    const badgeClass = `badge-${p.type}`;
    let configRows = '';
    const cfg = p.config;
    for (const [k,v] of Object.entries(cfg)) {
      if (k === 'note') continue;
      configRows += `<div class="config-row"><span class="k">${k}</span><span class="v">${v}</span></div>`;
    }
    let noteHtml = '';
    if (cfg.note) {
      noteHtml = `<div class="note">${cfg.note}</div>`;
    }
    let linkBtn = '';
    if (p.link) {
      linkBtn = `<button class="btn btn-primary" onclick="copy(\`${p.link.replace(/`/g,'\\`')}\`)">Copy Link</button>`;
    }
    // For VMess, generate base64 link
    let vmessBtn = '';
    if (p.type === 'vmess' && tunnelHost) {
      const vmessObj = {v:"2",ps:"Back4App-VMess",add:tunnelHost,port:"443",id:data.uuid,aid:"0",scy:"auto",net:"ws",type:"none",host:tunnelHost,path:"/vmess",tls:"tls",sni:tunnelHost};
      const vmessLink = 'vmess://' + btoa(JSON.stringify(vmessObj));
      vmessBtn = `<button class="btn btn-primary" onclick="copy('${vmessLink}')">Copy VMess Link</button>`;
    }
    html += `<div class="proto-card">
      <div class="proto-header" onclick="toggleCard(this)">
        <h3><span class="proto-badge ${badgeClass}">${p.name}</span></h3>
        <span class="proto-toggle">&#9660;</span>
      </div>
      <div class="proto-body">
        ${configRows}
        <div class="btn-group">
          ${linkBtn}${vmessBtn}
          <button class="btn btn-secondary" onclick="copy(JSON.stringify(${JSON.stringify(cfg).replace(/"/g,"'")}))">Copy Config JSON</button>
        </div>
        ${noteHtml}
      </div>
    </div>`;
  });
  html += '</div>';
  $('#content').innerHTML = html;
}

function toggleCard(el) {
  const body = el.nextElementSibling;
  const toggle = el.querySelector('.proto-toggle');
  body.classList.toggle('show');
  toggle.classList.toggle('open');
}

// Fetch node data
fetch('/api/nodes')
  .then(r => r.json())
  .then(data => renderDashboard(data))
  .catch(e => {
    $('#content').innerHTML = `<div class="info-box"><div class="label">Error</div><div class="value" style="color:#ff5252">Failed to load node data: ${e.message}</div></div>`;
  });
</script>
</body>
</html>
